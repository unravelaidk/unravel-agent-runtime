name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x64, executable: unravel-agent-node }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64, executable: unravel-agent-node }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, platform: darwin-x64, executable: unravel-agent-node }
          - { runner: macos-latest, target: aarch64-apple-darwin, platform: darwin-arm64, executable: unravel-agent-node }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, platform: win32-x64, executable: unravel-agent-node.exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p unravel-agent-node --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.executable }}
          if-no-files-found: error

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/unravel-agent-runtime/package-lock.json
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo package -p unravel-agent-runtime --locked
      - run: cargo build -p unravel-agent-node --locked
      - run: mkdir -p packages/unravel-agent-runtime/bin/linux-x64 && cp target/debug/unravel-agent-node packages/unravel-agent-runtime/bin/linux-x64/
      - run: npm ci && npm run build && npm test
        working-directory: packages/unravel-agent-runtime

  publish:
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/unravel-agent-runtime/package-lock.json
      - run: npm install -g npm@11
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-x64'
          path: packages/unravel-agent-runtime/bin
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-arm64'
          path: packages/unravel-agent-runtime/bin
      - name: Restore executable permissions
        run: chmod +x packages/unravel-agent-runtime/bin/{linux-*,darwin-*}/unravel-agent-node
      - name: Check matching versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./packages/unravel-agent-runtime/package.json").version')" = "$VERSION"
          grep -q "^version = \"$VERSION\"$" Cargo.toml
          test -f packages/unravel-agent-runtime/bin/linux-x64/unravel-agent-node
          test -f packages/unravel-agent-runtime/bin/linux-arm64/unravel-agent-node
          test -f packages/unravel-agent-runtime/bin/darwin-x64/unravel-agent-node
          test -f packages/unravel-agent-runtime/bin/darwin-arm64/unravel-agent-node
          test -f packages/unravel-agent-runtime/bin/win32-x64/unravel-agent-node.exe
          test -x packages/unravel-agent-runtime/bin/linux-x64/unravel-agent-node
      - name: Publish Rust crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p unravel-agent-runtime --locked
          for attempt in $(seq 1 15); do
            if cargo publish -p unravel-agent-providers --locked; then break; fi
            if [ "$attempt" -eq 15 ]; then exit 1; fi
            sleep 30
          done
      - run: npm ci && npm run build && npm pack --dry-run && npm publish --access public --provenance
        working-directory: packages/unravel-agent-runtime
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
